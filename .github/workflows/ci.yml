name: CI

on:
  # Every branch is tested as soon as it is pushed, with or without a pull request.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ matches src/
        shell: bash
        run: git diff --exit-code -- dist/ || (echo "Run npm run build and commit dist/." && exit 1)
      - run: npm audit --audit-level=high
